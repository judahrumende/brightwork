name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://brightwork:brightwork-local@127.0.0.1:5432/brightwork
      TEST_DATABASE_URL: postgresql://brightwork:brightwork-local@127.0.0.1:5432/brightwork
      TEST_MAILPIT_URL: http://127.0.0.1:8025
      REDIS_URL: redis://127.0.0.1:6379
      WEBSITE_WORKER_TEST_DATABASE_URL: postgresql://brightwork:brightwork-local@127.0.0.1:5432/website_worker
      AUTH_SECRET: temporary-fixture-key-for-ephemeral-ci-only
      SMTP_HOST: 127.0.0.1
      MAIL_FROM: Brightwork <hello@brightwork.test>
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm lint && pnpm contracts:check && pnpm parity:check
      - run: pnpm typecheck && pnpm build && pnpm test:unit
      - run: pnpm --filter @brightwork/api test:unit
      - run: pnpm --filter @brightwork/api test:research && pnpm --filter @brightwork/api test:growth
      - name: Start disposable services and apply migrations
        run: |
          docker compose up -d --wait --wait-timeout 90
          curl --fail --silent --show-error --retry 6 --retry-all-errors http://127.0.0.1:8025/readyz
          curl --fail --silent --show-error --retry 6 --retry-all-errors http://127.0.0.1:9000/minio/health/ready
          pnpm --filter @brightwork/api db:migrate
          docker compose exec -T postgres createdb -U brightwork website_worker
          DATABASE_URL="$WEBSITE_WORKER_TEST_DATABASE_URL" pnpm --filter @brightwork/api db:migrate
      - run: pnpm --filter @brightwork/worker test
      - run: pnpm --filter @brightwork/api test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test --workers=2
      - run: pnpm test:ssr
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
